<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code review</title>
  <link rel="stylesheet" href="review.css">
  <script src="images.js" defer></script>
  <script src="review.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="review-source">
      <div class="review-title"><h1>Code review</h1><span id="review-totals"></span></div>
      <p class="review-comparison">
        <strong id="source-name"></strong>
        <span id="comparison" hidden></span>
      </p>
    </div>
    <p id="checkout-details" hidden>
      <span id="checkout-branch"></span>
      <code id="checkout-path" tabindex="0" title="Local repository path"></code>
    </p>
    <div class="actions" id="review-actions">
      <label id="layout-control" hidden><span>Diff layout</span>
        <select id="diff-layout" aria-label="Diff layout">
          <option value="split">Split</option>
          <option value="unified">Unified</option>
        </select>
      </label>
    </div>
  </header>
  <p id="error" role="alert" hidden></p>
  <div id="workspace" class="workspace" hidden>
    <aside id="file-sidebar" class="file-sidebar" aria-label="File navigation">
      <div class="files-heading">
        <div id="files-overview" class="files-overview">
          <h2>Changed files</h2>
          <span id="progress" role="status"></span>
        </div>
        <button id="toggle-files" class="sidebar-toggle" type="button" aria-controls="changed-files" aria-label="Collapse changed files">
          <span class="sidebar-icon" aria-hidden="true"></span>
        </button>
      </div>
      <nav id="changed-files" aria-label="Changed files">
        <ul id="file-list"></ul>
      </nav>
      <div class="files-footer">
        <button id="submit-review" class="primary" type="button" aria-label="Submit review" title="Submit review" disabled>
          <span class="submit-icon" aria-hidden="true"></span>
          <span class="submit-label">Submit review</span>
        </button>
      </div>
    </aside>
    <div id="sidebar-divider" class="resize-handle sidebar-divider" role="separator" tabindex="0"
         aria-orientation="vertical" aria-label="Changed files width" aria-controls="changed-files"></div>
    <main id="diffs">
      <p id="empty" hidden>No changed files in this comparison.</p>
    </main>
  </div>
  <p id="completion" role="status" hidden></p>
  <section id="editor" aria-labelledby="editor-title" hidden>
    <form id="comment-form">
      <p id="anchor"></p>
      <pre id="quote"></pre>
      <label id="editor-title" for="comment-body">Comment on code</label>
      <textarea id="comment-body" required maxlength="12000" rows="3" enterkeyhint="send"></textarea>
      <p id="editor-error" role="alert" hidden></p>
      <div class="actions editor-actions">
        <button id="delete-comment" type="button" hidden>Delete</button>
        <button id="cancel-comment" type="button">Cancel</button>
        <button id="save-comment" class="primary" type="submit">Save comment</button>
      </div>
    </form>
  </section>
</body>
</html>
